          - media_kit
          - policy
          - presentation
          - report
        description: |-
          * `group_profile` - Corporate Profile
          * `presentation` - Corporate Presentation
          * `policy` - Corporate Policy / Code of Conduct
          * `report` - Annual / Operations Report
          * `impact_report` - Impact & Foundation Report
          * `media_kit` - Media Kit
          * `brand_assets` - Brand Guidelines & Assets
          * `governance` - Governance & Compliance Document
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
