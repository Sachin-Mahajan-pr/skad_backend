      - technology
      - international
      - founder
      type: string
      description: |-
        * `strategic` - Strategic Partner
        * `supplier` - Supplier / Manufacturer
        * `distributor` - Distributor
        * `technology` - Technology Partner
        * `international` - International Trade Partner
        * `founder` - Ecosystem Founder
    Person:
      type: object
      properties:
        slug:
          type: string
          maxLength: 160
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 140
        title:
          type: string
          description: e.g. Founder & Group CEO, Head of Technology
          maxLength: 140
        group:
          $ref: '#/components/schemas/GroupEnum'
        group_display:
          type: string
          readOnly: true
