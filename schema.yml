          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        company_name:
          type: string
          readOnly: true
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - bio
      - company_name
      - group_display
      - name
      - slug
      - title
    Platform:
      type: object
      properties:
        slug:
          type: string
          maxLength: 180
