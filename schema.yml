          - commerce
          - creative
          - cx
          - finance
          - manufacturing
          - marketing
          - sales
          - technology
          - trade
        description: |-
          * `technology` - Technology & Engineering
          * `ai` - AI & Automation
          * `commerce` - Commerce & Operations
          * `creative` - Brand & Creative
          * `marketing` - Marketing & Growth
          * `finance` - Finance & Corporate
          * `sales` - Sales & Partnerships
          * `manufacturing` - Manufacturing & Supply
          * `trade` - International Trade
          * `cx` - Customer Experience
      - in: query
        name: employment_type
        schema:
          type: string
          enum:
