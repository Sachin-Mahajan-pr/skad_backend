components:
  schemas:
    ApplicationCreate:
      type: object
      properties:
        career:
          type: integer
          nullable: true
          description: Null for general profile submissions
        candidate_name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 32
        linkedin_profile:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        cv_file:
          type: string
          format: uri
          description: Candidate CV/resume stored in secure private bucket.
        cover_letter:
          type: string
        consent_recorded:
          type: boolean
          description: Consent for processing candidate data during recruitment.
      required:
      - candidate_name
      - consent_recorded
      - cv_file
      - email
    ApplicationCreateRequest:
      type: object
      properties:
        career:
          type: integer
          nullable: true
          description: Null for general profile submissions
        candidate_name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        phone:
          type: string
          maxLength: 32
        linkedin_profile:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        cv_file:
          type: string
          format: binary
          description: Candidate CV/resume stored in secure private bucket.
        cover_letter:
          type: string
        consent_recorded:
          type: boolean
          description: Consent for processing candidate data during recruitment.
        website:
          type: string
          writeOnly: true
      required:
      - candidate_name
      - consent_recorded
      - cv_file
      - email
    ApplicationRouteEnum:
      enum:
      - form
      - external
      type: string
      description: |-
        * `form` - Direct Application Form
        * `external` - External Career Portal
    Article:
      type: object
      properties:
        slug:
          type: string
          maxLength: 220
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 200
        category:
          type: string
          readOnly: true
        tags:
          type: array
          items:
            type: string
          readOnly: true
        author_name:
          type: string
          readOnly: true
        hero_image:
          type: string
          format: uri
          nullable: true
        hero_alt:
          type: string
          maxLength: 200
        excerpt:
          type: string
        body:
          type: string
        reading_minutes:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        publish_at:
          type: string
          format: date-time
        seo_title:
          type: string
          description: Optimal length 50-60 characters
          maxLength: 70
        seo_description:
          type: string
          description: Optimal length 150-160 characters
          maxLength: 170
      required:
      - author_name
      - body
      - category
      - slug
      - tags
      - title
    BackgroundEnum:
      enum:
      - white
      - offwhite
      - navy
      type: string
      description: |-
        * `white` - White
        * `offwhite` - Warm Off-White
        * `navy` - Deep Navy
    Brand:
      type: object
      properties:
        slug:
          type: string
          maxLength: 180
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 160
        tagline:
          type: string
          maxLength: 200
        category:
          type: string
          maxLength: 120
        market_scope:
          $ref: '#/components/schemas/MarketScopeEnum'
        positioning:
          type: string
        target_market:
          type: string
        summary:
          type: string
        body:
          type: string
          description: Sanitised rich text or markdown description
        theme:
          description: 'Custom brand design tokens: palette, display fonts, button
            style, hero layout.'
        website_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        cta_label:
          type: string
          description: e.g. 'EXPLORE DETARA', 'CREATE YOUR ZEMO', 'VISIT BENAVI'
          maxLength: 60
        logo:
          type: string
          format: uri
          nullable: true
        company:
          allOf:
          - $ref: '#/components/schemas/CompanyRef'
          readOnly: true
        capabilities:
          type: array
          items:
            type: string
          readOnly: true
        industries:
          type: array
          items:
            type: string
          readOnly: true
        seo_title:
          type: string
          description: Optimal length 50-60 characters
          maxLength: 70
        seo_description:
          type: string
          description: Optimal length 150-160 characters
          maxLength: 170
        canonical_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
      required:
      - capabilities
      - category
      - company
      - industries
      - name
      - slug
    BrandRef:
      type: object
      properties:
        slug:
          type: string
          maxLength: 180
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 160
        tagline:
          type: string
          maxLength: 200
        category:
          type: string
          maxLength: 120
        market_scope:
          $ref: '#/components/schemas/MarketScopeEnum'
        cta_label:
          type: string
          description: e.g. 'EXPLORE DETARA', 'CREATE YOUR ZEMO', 'VISIT BENAVI'
          maxLength: 60
        website_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
      required:
      - category
      - name
