openapi: 3.0.3
info:
  title: SKAD GROUP Corporate REST API
  version: 1.0.0
  description: Complete REST API for the SKAD GROUP corporate website ecosystem. Provides
    content delivery for Next.js, interactive ecosystem graph, enquiry routing, careers
    pipeline, governance documents, and SEO sitemaps.
paths:
  /api/v1/applications/:
    post:
      operationId: v1_applications_create
      description: |-
        Submits a candidate job application with resume upload.
        CV files are safely stored in private storage.
      tags:
      - Careers & Talent
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationCreate'
          description: ''
  /api/v1/articles/:
    get:
      operationId: v1_articles_list
      parameters:
      - in: query
        name: category__slug
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArticleList'
          description: ''
